<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>臨床病理部教學評核整合平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* 依 10/27 認可的首頁設計圖：米白紙感底、珊瑚橘強調、灰藍綠輔色、細體大字 */
  --paper:#F5F1EA; --paper-2:#EDE6DB; --card:#FFFFFF; --ink:#23282C; --ink-2:#4A5157; --muted:#7A8085;
  --line:#E3DCD1; --coral:#E07A5F; --coral-soft:#F7DDD3; --sage:#7FA5A3; --sage-deep:#3F6E6C; --sage-soft:#DCE9E7;
  --good:#3E8E6A; --good-soft:#E2F1E8; --warn:#B7791F; --warn-soft:#FBEFD9; --bad:#B8505B; --bad-soft:#F8E1E3;
  --font-display:"Outfit","Noto Sans TC",system-ui,sans-serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(35,40,44,.04),0 8px 24px rgba(35,40,44,.05);
  /* 版面：頂部導覽列＋置中內容欄（最寬 1200px），卡片只用在需要框起來的資訊 */
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{text-wrap:balance;margin:0;font-weight:500;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:6px}
a{color:var(--sage-deep)}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- 頂部 ---- */
.demo-bar{background:var(--ink);color:#EDE6DB;font-size:12.5px;padding:7px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.demo-bar label{display:flex;gap:8px;align-items:center}
.demo-bar select{background:#353C41;border:1px solid #4A5157;color:#fff;border-radius:6px;padding:3px 8px}
.top{position:sticky;top:0;z-index:20;background:rgba(245,241,234,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);flex-shrink:0}
.brand-mark{font-family:var(--font-display);font-weight:300;font-size:26px;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.brand-mark i{display:block;width:22px;height:22px;border-radius:50% 50% 50% 0;background:linear-gradient(135deg,var(--coral),#F2B49E 55%,var(--sage))}
.brand-text{font-size:12px;line-height:1.35;border-left:1px solid var(--line);padding-left:12px}
.brand-text b{font-weight:600;font-size:13px}
.brand-text span{color:var(--muted);font-family:var(--font-display);letter-spacing:.02em}
.nav{display:flex;gap:0;flex-wrap:nowrap;flex:1;overflow-x:auto}
.nav a{padding:7px 9px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-size:14px;position:relative;white-space:nowrap}
.nav a:hover{background:var(--paper-2)}
.nav a.on{color:var(--ink);font-weight:600}
.nav a.on::after{content:"";position:absolute;left:9px;right:9px;bottom:1px;height:2px;background:var(--coral);border-radius:2px}
.who{display:flex;align-items:center;gap:10px;font-size:13px;flex-shrink:0}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--sage-soft);color:var(--sage-deep);font-weight:600}
.who small{display:block;color:var(--muted);font-size:11.5px;line-height:1.2}

main{max-width:1240px;margin:0 auto;padding:28px 24px 80px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin:8px 0 22px}
.eyebrow{font-family:var(--font-display);font-size:12px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:10px}
.eyebrow::after{content:"";width:28px;height:1px;background:var(--muted)}
.page-head h1{font-size:30px;font-weight:400;margin-top:6px;letter-spacing:.01em}
.page-head p{margin:6px 0 0;color:var(--ink-2);max-width:68ch}

/* ---- 共用元件 ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.card h3{font-size:16px;font-weight:600}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-73{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:980px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-73,.g2{grid-template-columns:1fr}.nav{display:none}.top-in{justify-content:space-between}}
@media (max-width:560px){.g3,.g4{grid-template-columns:1fr}main{padding:20px 16px 60px}.brand-text{display:none}.page-head h1{font-size:24px}}
.mobile-nav{display:none}
@media (max-width:980px){.mobile-nav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--paper)}.mobile-nav a{flex-shrink:0;padding:6px 12px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--ink-2);font-size:13px;background:var(--card)}.mobile-nav a.on{background:var(--ink);color:#fff;border-color:var(--ink)}}

.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:999px;padding:8px 18px;font-size:14px;display:inline-flex;align-items:center;gap:8px;transition:.15s}
.btn:hover{background:#000}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.coral{background:var(--coral);border-color:var(--coral)}
.btn.coral:hover{background:#c9654b}
.btn.sm{padding:5px 13px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link-btn{background:none;border:0;color:var(--sage-deep);padding:0;text-decoration:underline;text-underline-offset:3px;font-size:13.5px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--paper-2);color:var(--ink-2)}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.sage{background:var(--sage-soft);color:var(--sage-deep)}.pill.coral{background:var(--coral-soft);color:#A9472F}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 7px;font-size:12px;color:var(--ink-2);background:var(--paper)}
.muted{color:var(--muted)}.small{font-size:13px}.xs{font-size:12px}
.note{border-left:3px solid var(--sage);background:var(--sage-soft);padding:10px 14px;border-radius:0 10px 10px 0;font-size:13.5px;color:var(--sage-deep)}
.note.warn{border-color:var(--warn);background:var(--warn-soft);color:#7A5214}
.note.coral{border-color:var(--coral);background:var(--coral-soft);color:#8E3B26}
.mock{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:2px 9px}
.mock::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stack{display:grid;gap:12px}
hr.sep{border:0;border-top:1px solid var(--line);margin:18px 0}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.04em;background:#FBF9F5;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.flag td{background:#FFFBF2}

.field{display:grid;gap:6px}
.field label{font-size:12.5px;color:var(--ink-2);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;width:100%}
.field input[readonly]{background:var(--paper);color:var(--ink-2)}
.field textarea{min-height:80px;resize:vertical}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
.toolbar .field{min-width:150px}
.seg{display:inline-flex;background:var(--paper-2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 14px;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:600}

/* ---- 首頁 ---- */
.hero{position:relative;border-radius:22px;overflow:hidden;background:#FBF8F3;border:1px solid var(--line);min-height:330px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.hero-copy{padding:40px 44px;position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;gap:12px}
.hero h1{font-family:var(--font-display);font-weight:200;font-size:clamp(40px,5.4vw,66px);line-height:1;letter-spacing:.01em;text-transform:uppercase}
.hero h1 em{font-style:normal;color:var(--coral)}
.hero .sub{font-size:19px;letter-spacing:.06em;font-weight:400}
.hero .sub2{color:var(--ink-2);font-size:13.5px;max-width:40ch}
.hero-art{position:relative;min-height:260px}
.hero-art svg{position:absolute;inset:0;width:100%;height:100%}
.hero-card{position:absolute;right:26px;bottom:26px;left:26px;z-index:3;background:rgba(255,255,255,.88);backdrop-filter:blur(6px);border-radius:14px;padding:16px 18px;border:1px solid rgba(255,255,255,.7)}
.hero-org{position:absolute;right:30px;top:26px;z-index:3;text-align:right;font-size:12px;color:var(--ink-2);line-height:1.5}
.hero-org b{display:block;font-size:20px;font-weight:500;color:var(--ink);letter-spacing:.06em}
@media (max-width:820px){.hero{grid-template-columns:1fr}.hero-copy{padding:30px 24px}.hero-art{min-height:220px}}
.entries{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);margin-top:26px}
@media (max-width:820px){.entries{grid-template-columns:repeat(2,minmax(0,1fr))}}
.entry{padding:18px 18px 18px 0;text-decoration:none;color:var(--ink);display:grid;gap:4px;border-bottom:1px solid var(--line)}
.entry .no{font-family:var(--font-display);font-weight:200;font-size:30px;color:var(--ink-2);display:flex;align-items:center;gap:12px}
.entry .no::after{content:"";width:32px;height:1px;background:var(--line)}
.entry b{font-weight:600;font-size:15px}
.entry span{font-family:var(--font-display);font-size:12px;color:var(--muted);letter-spacing:.06em}
.entry:hover b{color:var(--coral)}
.stat{display:grid;gap:2px;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:16px 18px;transition:.15s;text-align:left}
.stat:hover{border-color:var(--ink-2);transform:translateY(-1px)}
.stat .v{font-family:var(--font-display);font-size:34px;font-weight:300;line-height:1.1}
.stat .l{font-size:13px;color:var(--ink-2)}
.stat .h{font-size:12px;color:var(--muted)}
.stat.alert .v{color:var(--coral)}
.list-item{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item b{font-weight:600;font-size:14px}
.list-item small{display:block;color:var(--muted);font-size:12.5px}

/* ---- 問卷 ---- */
.batch-login{max-width:460px;margin:30px auto;text-align:center}
.batch-login .card{padding:34px}
.teams-msg{background:#F2F0FA;border:1px solid #DCD8F0;border-radius:12px;padding:14px 16px;text-align:left;font-size:13.5px;margin-bottom:20px}
.teams-msg b{color:#4B4594}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.task .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-display);font-size:13px;font-weight:600}
.task.done{opacity:.72}
.info-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 20px;background:#FBF9F5;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
@media (max-width:700px){.info-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.info-grid small{display:block;color:var(--muted);font-size:11.5px}
.info-grid b{font-weight:600;font-size:14px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.steps div{border-top:3px solid var(--line);padding-top:8px;font-size:13px;color:var(--muted)}
.steps div.on{border-color:var(--coral);color:var(--ink);font-weight:600}
.steps div.done{border-color:var(--sage);color:var(--sage-deep)}
.scale-ref{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale-ref div{background:var(--paper);border-radius:8px;padding:6px 4px;text-align:center;font-size:12px}
.scale-ref b{display:block;font-family:var(--font-display);font-weight:500;font-size:13px}
.q{padding:18px 0;border-bottom:1px solid var(--line)}
.q:last-of-type{border-bottom:0}
.q-title{display:flex;gap:12px}
.q-no{font-family:var(--font-display);font-size:15px;color:var(--muted);min-width:24px;font-variant-numeric:tabular-nums}
.q-text{font-weight:500}
.q-tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
.score{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:5px;max-width:560px;margin-left:36px}
.score button{border:1px solid var(--line);background:#fff;border-radius:8px;height:38px;font-family:var(--font-display);font-size:15px;font-variant-numeric:tabular-nums;transition:.12s}
.score button:hover{border-color:var(--ink-2)}
.score button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.score-ends{display:flex;justify-content:space-between;max-width:560px;margin:4px 0 0 36px;font-size:11.5px;color:var(--muted)}
.score-picked{margin:6px 0 0 36px;font-size:13px;color:var(--sage-deep)}
@media (max-width:560px){.score,.score-ends,.score-picked{margin-left:0}.score button{height:34px;font-size:13px}}
.fb-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.fb-grid{grid-template-columns:1fr}}
.fb{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff;display:grid;gap:12px;align-content:start;position:relative}
.fb.picked{border-color:var(--sage)}
.fb-h b{font-weight:600}
.fb-h small{display:block;color:var(--muted);font-size:12px}
.fb-check{position:absolute;right:14px;top:14px;width:20px;height:20px;border-radius:50%;background:var(--good);color:#fff;font-size:12px;display:grid;place-items:center}
.fb-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fb-btns button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 4px;font-size:12.5px;display:grid;gap:2px;justify-items:center;transition:.12s}
.fb-btns button .s{font-size:16px;line-height:1}
.fb-btns button.d0 .s{color:var(--good)}.fb-btns button.d1 .s{color:var(--warn)}.fb-btns button.d2 .s{color:var(--bad)}
.fb-btns button.on.d0{background:var(--good-soft);border-color:var(--good)}
.fb-btns button.on.d1{background:var(--warn-soft);border-color:var(--warn)}
.fb-btns button.on.d2{background:var(--bad-soft);border-color:var(--bad)}
.fb-text{background:var(--paper);border-radius:10px;padding:10px 12px;font-size:13.5px}
.fb-text small{display:block;color:var(--muted);font-size:11.5px}
.sticky-foot{position:sticky;bottom:0;background:linear-gradient(transparent,var(--paper) 30%);padding:22px 0 6px;margin-top:10px}

/* ---- 圖表 ---- */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.kpi{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:16px;display:grid;gap:4px}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-family:var(--font-display);font-weight:300;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .h{font-size:11.5px;color:var(--muted)}

/* ---- 對話框、提示 ---- */
.modal-bg{position:fixed;inset:0;background:rgba(35,40,44,.42);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
.modal-bg.show{display:flex}
.modal{background:var(--card);border-radius:18px;max-width:760px;width:100%;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h2{font-size:20px;font-weight:500}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1}

/* ---- 時間軸、里程碑 ---- */
.timeline{display:grid;gap:0}
.tl{display:grid;grid-template-columns:18px minmax(0,1fr);gap:12px;position:relative;padding-bottom:14px}
.tl::before{content:"";position:absolute;left:8px;top:16px;bottom:0;width:1px;background:var(--line)}
.tl:last-child::before{display:none}
.tl i{width:17px;height:17px;border-radius:50%;border:2px solid var(--line);background:#fff;margin-top:3px}
.tl.ok i{border-color:var(--good);background:var(--good)}.tl.now i{border-color:var(--coral)}.tl.no i{border-color:var(--bad);background:var(--bad)}
.lv{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 6px;border-radius:6px;font-family:var(--font-display);font-weight:600;font-size:13px;background:var(--paper-2)}
.lv.l3{background:var(--sage-soft);color:var(--sage-deep)}.lv.l4,.lv.l5{background:var(--coral-soft);color:#A9472F}
.ox{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.ox button{border:0;background:#fff;width:30px;height:26px;font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--muted)}
.ox button.on.o{background:var(--good);color:#fff}.ox button.on.x{background:var(--bad);color:#fff}
.ox button:disabled{cursor:default}
.ind{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:10px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.ind:last-child{border-bottom:0}
.rank-card{background:linear-gradient(120deg,#2E3539,#3F6E6C);color:#fff;border-radius:18px;padding:24px}
.rank-card small{color:#CFE0DE}
.rank-card .big{font-family:var(--font-display);font-weight:300;font-size:30px;margin:6px 0}

/* 表單元件固定淺色（避免系統深色模式套用原生深色樣式） */
select,input,textarea{background-color:#fff;color:var(--ink);color-scheme:light}
select option{background:#fff;color:var(--ink)}
input[readonly]{background-color:var(--paper)}
.demo-bar select{background:#353C41;color:#fff;color-scheme:dark}
.demo-bar select option{background:#353C41;color:#fff}
td.who-col{min-width:150px}
td.n,th.n{white-space:nowrap}
td.head-col{min-width:170px}

/* QP019-15 紙本預覽 */

function submitTask(){
  const t=TASKS.find(x=>x.id===STATE.openTask);
  if(t.demo){ STATE.demoDone[t.id]=(STATE.demoDone[t.id]||0)+1; STATE.openTask=null; render(); window.scrollTo(0,0); toast('試填完成（不計入正式任務）'); return; }

}

/* 課程與異動改用 115 年度實際課程（RC）；不再使用示意人名（11/8） */
const CRS = () => { RC.forEach(c=>{ const dsc=Object.getOwnPropertyDescriptor(c,'date'); if(!dsc||!dsc.get){ Object.defineProperty(c,'date',{get(){return this.d||'';},set(v){this.d=v;},configurable:true,enumerable:true}); if(c.time==null) c.time=''; } }); return RC; };

function reminders(c){
  if(c.status==='已取消') return '<span class="xs muted">已取消，停止提醒</span>';
  if(!c.date) return '<span class="xs muted">未排定，不發提醒</span>';
  const d=parseDT(c.date,c.time), r7=at9(addDays(d,-7)), r1=at9(addDays(d,-1));
  const f=x=> x<TODAY ? `<span class="muted">✓ ${fmtD(x).slice(5)} 09:00</span>` : `<span>⏱ ${fmtD(x).slice(5)} 09:00</span>`;
  if(d<TODAY) return '<span class="xs muted">已授課</span>';
  return `<div class="xs">約課 ${f(r7)}<br>前一天 ${f(r1)}</div>`;
}

function saveCourse(id){
  const g=k=>document.getElementById(k)?.value||'';

  if(!c){ c={id:'S-0'+(200+CRS().length),master:'C-NEW',dept:'生化鏡檢組',sv:SV4,versions:[]}; CRS().push(c); }
  const before=`${c.date||'未排定'} ${c.time||''}`;
  Object.assign(c,{name:g('e-name'),stage:g('e-stage'),teacher:g('e-teacher'),student:g('e-student'),date:g('e-date'),time:g('e-time'),place:g('e-place')});
  c.status = id ? g('e-st') : (c.date?'已排定':'待排課');
  if(c.status==='已排定' && !c.date) c.status='待排課';
  c.manual=true; const at=nowStamp();
  c.versions.push({at,who:ROLES[STATE.role].person.name,date:c.date,time:c.time,note:'手動修改：'+(g('e-note')||'未填原因')});
  STATE.audit.unshift({at,who:ROLES[STATE.role].person.name,act:id?'手動修改課程':'手動新增課程',detail:`${c.name}｜${before} → ${c.date||'未排定'} ${c.time||''}`});
  closeModal(); render(); toast('已儲存，未送出的提醒已依新時間重算');
}

    <div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Excel 欄位</th><th>對應到系統欄位</th></tr></thead><tbody>${map.map(([a,b])=>`<tr><td>${a}</td><td><select aria-label="${a} 對應欄位" style="border:1px solid var(--line);border-radius:8px;padding:4px 8px"><option>${b}</option><option>（不匯入）</option></select></td></tr>`).join('')}</tbody></table></div>

function commitImport(){
  const at=nowStamp();
  IMPORT_ROWS.forEach(r=>{
    if(r.act==='更新'){ const c=CRS().find(x=>x.id===r.id); if(c&&c.status==='待排課'){ c.date=r.d;c.time=r.t;c.status='已排定';c.place=c.place||'生化鏡檢組教室';c.versions.push({at,who:'季度匯入 Q4 第 2 批',date:c.date,time:c.time,note:'補上日期'});} }
    if(r.act==='新增' && !CRS().some(x=>x.name===r.course)) CRS().push({id:'S-0'+(200+CRS().length),master:'C-BIO-NEW',stage:r.stage,name:r.course,dept:'生化鏡檢組',teacher:r.teacher,student:r.student,date:r.d,time:r.t,place:'生化鏡檢組教室',status:'已排定',sv:SV4,versions:[{at,who:'季度匯入 Q4 第 2 批',date:r.d,time:r.t,note:'新增'}]});
    if(r.act==='衝突' && IMP.conflict==='file'){ const c=CRS().find(x=>x.id===r.id); c.date='2026-11-12'; c.time='14:00'; c.manual=false; c.versions.push({at,who:'季度匯入 Q4 第 2 批',date:c.date,time:c.time,note:'衝突處理：改用檔案資料'}); }
  });
  STATE.audit.unshift({at,who:ROLES[STATE.role].person.name,act:'季度課表匯入',detail:`批次 IMP-2026Q4-2：新增 2、更新 3、衝突 1（${IMP.conflict==='keep'?'保留手動修改':'改用檔案'}）、錯誤 1 未寫入`});
  closeModal(); render(); toast('已寫入，並保留這次匯入批次紀錄');
}

    </div>` : '';
  return `${head('QP019-15','課程時間異動','學員填寫 → 授課教師簽核 → 教學品保組（a40469）簽核 → 系統更新正式課表。當日臨時異動也走相同流程，審核中不會先改正式時間。',
    `<div class="row">${(r==='admin'||r==='qa'||r==='student')?`<a class="btn coral" href="#change" onclick="setTimeout(()=>document.getElementById('qp-export')?.scrollIntoView({behavior:'smooth'}),60)">匯出 QP019-15 表單</a>`:''}<button class="btn ghost" onclick="openExport()">匯出異動紀錄</button></div>`)}

/* ============ QP019-15 依「學員 × 課程階段」匯出 ============ */
const QPX={student:'',stage:'',pending:false};
const rocD = d => { if(!d) return ''; const [y,m,dd]=d.split('-'); return `${+y-1911}/${m}/${dd}`; };
const rocDT = at => `${at.getFullYear()-1911}/${String(at.getMonth()+1).padStart(2,'0')}/${String(at.getDate()).padStart(2,'0')}`;
function qpGroups(r){
  const g={};
  CHANGES.forEach(x=>{ const c=CRS().find(k=>k.id===x.course); if(!c) return; if(r==='student' && x.student!==meStu()) return;
    const k=x.student+'|'+c.stage; (g[k]=g[k]||{student:x.student,stage:c.stage,ok:0,pend:0}); x.status==='ok'?g[k].ok++:(x.status==='t'||x.status==='q')?g[k].pend++:0; });
  return Object.values(g).sort((a,b)=>a.student.localeCompare(b.student,'zh-Hant')||a.stage.localeCompare(b.stage,'zh-Hant'));
}
function qpRows(student,stage,pending){
  return CHANGES.filter(x=>{ const c=CRS().find(k=>k.id===x.course); return c && x.student===student && c.stage===stage && (x.status==='ok' || (pending&&(x.status==='t'||x.status==='q'))); })
    .map(x=>({x,c:CRS().find(k=>k.id===x.course)})).sort((a,b)=>(a.x.oldD).localeCompare(b.x.oldD));
}
function qpPeriod(student,stage){
  const ds=CRS().filter(c=>c.student===student && c.stage===stage).flatMap(c=>c.versions.map(v=>v.date).concat(c.date)).filter(Boolean).sort();
  return ds.length?[ds[0],ds[ds.length-1]]:['',''];
}
function signOf(x,who){
  const f=a=>x.log.find(l=>l.act.includes(a));
  const l = who==='s'?f('學員送出') : who==='t'?f('授課教師核准') : f('教學品保組核准');
  const name = who==='s'?x.student : who==='t'?x.teacher : 'a40469';
  if(!l) return `<span class="qp-wait">${who==='s'?'':'待簽核'}</span>`;
  return `<span class="qp-sign">${esc(name)}</span><span class="qp-at">${rocDT(l.at)}</span>`;
}
function qpForm(student,stage,pending){
  const rows=qpRows(student,stage,pending), [a,b]=qpPeriod(student,stage);
  const ymdC = d => { if(!d) return ['　','　','　']; const [y,m,dd]=d.split('-'); return [+y-1911,+m,+dd]; };
  const A=ymdC(a), B=ymdC(b);
  const pad=Math.max(0,10-rows.length);
  return `<div class="qp-paper">
    <div class="qp-title">學員訓練課程時間異動表</div><div class="qp-code">QP019-15</div>
    <p>姓　名：<u>　${esc(student)}　</u></p>
    <p>訓練課程類別：<u>　${esc(stage)}　</u></p>
    <p>訓練期間：<u>&nbsp;${A[0]}&nbsp;</u>年<u>&nbsp;${A[1]}&nbsp;</u>月<u>&nbsp;${A[2]}&nbsp;</u>日至<u>&nbsp;${B[0]}&nbsp;</u>年<u>&nbsp;${B[1]}&nbsp;</u>月<u>&nbsp;${B[2]}&nbsp;</u>日</p>
    <table class="qp-t"><thead><tr><th style="width:21%">課程名稱</th><th style="width:17%">原課程時間<br>――――<br>異動後時間</th><th style="width:23%">異動原因說明</th><th>學員</th><th>授課教師</th><th>教學品保組</th></tr></thead>
    <tbody>${rows.map(({x,c})=>`<tr><td>${esc(c.name)}<div class="qp-id">${x.id}</div></td><td class="qp-c">${rocD(x.oldD)} ${x.oldT}<hr>${rocD(x.newD)} ${x.newT}</td><td>${esc(x.reason)}</td><td class="qp-c">${signOf(x,'s')}</td><td class="qp-c">${signOf(x,'t')}</td><td class="qp-c">${signOf(x,'q')}</td></tr>`).join('')}
    ${'<tr class="qp-empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>'.repeat(pad)}
    <tr><td colspan="6" class="qp-note">備註：${rows.length?`本表由系統於 ${rocDT(TODAY)} 依線上 QP019-15 申請紀錄產生，共 ${rows.length} 筆${pending?'（含簽核中案件）':'（僅列兩關核准案件）'}；簽核欄為線上電子簽核紀錄。`:'此階段沒有符合條件的異動紀錄。'}</td></tr></tbody></table>
    <p class="qp-small" style="margin-top:10px">*若因故無法如期完成訓練課程時，學員和負責訓練臨床教師必須擇日補課，若執行有困難時，得報請導師、管理階層、教學醫檢師、計畫主持人協調解決。</p>
    <div class="qp-foot">編修日期：2026.03.04</div>
  </div>`;
}
function qpExportBlock(r){
  const gs=qpGroups(r);
  if(!QPX.student && gs.length){ QPX.student=gs[0].student; QPX.stage=gs[0].stage; }
  const sel=gs.find(g=>g.student===QPX.student&&g.stage===QPX.stage)||gs[0];
  return `<div class="card" id="qp-export" style="margin-top:26px">
    <div class="card-head"><h3>匯出 QP019-15 學員訓練課程時間異動表</h3><span class="xs muted">依原表格式（編修日期 2026.03.04），一位學員的一個課程階段＝一張表</span></div>
    <div class="table-wrap"><table><thead><tr><th>學員</th><th>課程階段</th><th class="n">已核准</th><th class="n">簽核中</th><th></th></tr></thead><tbody>
      ${gs.map(g=>`<tr ${g===sel?'style="background:var(--coral-soft)"':''}><td>${esc(g.student)}</td><td>${esc(g.stage)}</td><td class="n num">${g.ok}</td><td class="n num">${g.pend}</td><td style="text-align:right"><button class="btn sm ${g===sel?'coral':'ghost'}" onclick="QPX.student='${g.student}';QPX.stage='${g.stage}';render();setTimeout(()=>document.getElementById('qp-prev').scrollIntoView({behavior:'smooth'}),60)">預覽此表</button></td></tr>`).join('')}

      <div class="row">${r!=='student'?`<button class="btn ghost" onclick="toast('正式版：一次下載所有學員 × 階段的 Word 檔（zip），每張表一個檔案')">批次匯出全部（${gs.length} 張）</button>`:''}<button class="btn" onclick="toast('正式版：下載以原 QP019-15 Word 範本填好的檔案；原型頁面無法下載')">下載 Word</button><button class="btn ghost" onclick="toast('正式版：同一張表另存 PDF')">下載 PDF</button></div>
    </div>
    ${sel?qpForm(sel.student,sel.stage,QPX.pending):'<p class="muted">目前沒有異動紀錄。</p>'}
    <p class="xs muted" style="margin-top:10px">訓練期間取該學員在此階段所有課程（含異動前後）的最早與最晚日期；超過 10 筆時自動延續到第二頁並重複表頭。</p>
  </div>`;
}
pChange.after=()=>{ const s=$('#x-course'); if(s){ const c=CRS().find(x=>x.id===s.value); $('#x-old').value=c?(c.date?`${c.date.replaceAll('-','/')} ${c.time||''}`.trim():'未排定'):''; } };
function changeCard(x){

  const canT = r==='teacher' && x.status==='t' && x.teacher===meT();
  const canQ = r==='qa' && x.status==='q';
  const steps=[['學員送出',true],['授課教師簽核',x.status==='q'||x.status==='ok'||(x.status==='rej'&&x.rejBy==='q')],['教學品保組 a40469 簽核',x.status==='ok'],['正式課表更新',x.status==='ok']];
  return `<div class="card">
    <div class="spread"><div><div class="xs muted">${x.id}・${esc(c.stage)}</div><b>${esc(c.name)}</b><div class="small muted">申請人 ${esc(x.student)}・授課教師 ${esc(x.teacher)}</div></div><span class="pill ${stLabel[1]}">${stLabel[0]}</span></div>

/* ============ 圖表（手寫 SVG） ============ */
const PASS_SCORE = 80;   // 雷達圖合格閾值環
function radarSVG({labels,series,min,max,ticks,size=360,fmt=v=>v,pass}){
  if(pass===undefined) pass = max===100 ? PASS_SCORE : null;
  const cx=size/2, cy=size/2+4, R=size*0.33, n=labels.length;
  const pt=(i,v)=>{ const a=-Math.PI/2+i*2*Math.PI/n, k=(Math.max(min,Math.min(max,v))-min)/(max-min); return [cx+Math.cos(a)*R*k, cy+Math.sin(a)*R*k]; };
  let s=`<svg viewBox="-70 0 ${size+140} ${size+8}" role="img" aria-label="雷達圖">`;
  ticks.forEach(t=>{ s+=`<polygon points="${labels.map((_,i)=>pt(i,t).join(',')).join(' ')}" fill="none" stroke="#E3DCD1"/>`; });
  ticks.forEach(t=>{ const p=pt(0,t); s+=`<text x="${p[0]+4}" y="${p[1]+3}" font-size="9" fill="#7A8085">${fmt(t)}</text>`; });
  labels.forEach((l,i)=>{ const p=pt(i,max); s+=`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#E3DCD1"/>`; const q=[cx+(p[0]-cx)*1.2,cy+(p[1]-cy)*1.16]; s+=`<text x="${q[0]}" y="${q[1]}" font-size="11.5" fill="#4A5157" text-anchor="${Math.abs(q[0]-cx)<8?'middle':q[0]>cx?'start':'end'}" dominant-baseline="middle">${esc(l)}</text>`; });
  const hasPass = pass!=null && pass>min && pass<max;
  if(hasPass){ const ring=labels.map((_,i)=>pt(i,pass).join(',')).join(' ');
    s+=`<polygon points="${ring}" fill="#E24B4A" fill-opacity="0.07" stroke="none"/>`; }
  series.forEach(se=>{ if(!se.vals) return; const pts=se.vals.map((v,i)=>pt(i,v).join(',')).join(' ');
    s+=`<polygon points="${pts}" fill="${se.fill?se.color:'none'}" fill-opacity="${se.fill?.14:0}" stroke="${se.color}" stroke-width="${se.w||2}" ${se.dash?`stroke-dasharray="${se.dash}"`:''} stroke-linejoin="round"/>`;
    if(!se.dash) se.vals.forEach((v,i)=>{ const p=pt(i,v); s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${se.color}"/>`; }); });
  if(hasPass){ const ring=labels.map((_,i)=>pt(i,pass).join(',')).join(' '), p0=pt(0,pass);
    s+=`<polygon points="${ring}" fill="none" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="5 4"/>`;
    s+=`<text x="${p0[0]-5}" y="${p0[1]+3}" font-size="10" font-weight="500" fill="#A32D2D" text-anchor="end">合格 ${pass}</text>`;
    series.forEach(se=>{ if(!se.vals) return; se.vals.forEach((v,i)=>{ if(v!=null && v<pass && v>min){ const p=pt(i,v);
      s+=`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="#E24B4A" stroke="#fff" stroke-width="1.5"><title>${esc(labels[i])}：${Math.round(v*10)/10}（未達 ${pass}）</title></circle>`; } }); });
    s+=`<g font-size="10" fill="#7A8085"><line x1="${size-40}" y1="${size}" x2="${size-22}" y2="${size}" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="5 4"/><text x="${size-18}" y="${size+3}">合格線 ${pass}</text></g>`; }
  return s+'</svg>';
}
function barsSVG({cats,series,max,height=220,unit='',min=0}){
  const W=560, H=height, padL=34, padB=46, padT=14, iw=W-padL-10, ih=H-padB-padT, gw=iw/cats.length, bw=Math.min(26,(gw-12)/series.length);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="長條圖">`;
  for(let k=0;k<=4;k++){ const v=min+(max-min)*k/4, y=padT+ih-ih*k/4; s+=`<line x1="${padL}" x2="${W-10}" y1="${y}" y2="${y}" stroke="#EDE6DB"/><text x="${padL-6}" y="${y+3}" font-size="9.5" fill="#7A8085" text-anchor="end">${Math.round(v)}</text>`; }
  cats.forEach((c,i)=>{ const x0=padL+gw*i+(gw-bw*series.length)/2;
    series.forEach((se,j)=>{ const v=se.vals[i]; if(v==null) return; const h=ih*(v-min)/(max-min), x=x0+j*bw, y=padT+ih-h;
      s+=`<rect x="${x+1}" y="${y}" width="${bw-2}" height="${h}" rx="3" fill="${se.color}"><title>${esc(c)}｜${esc(se.name)}：${v}${unit}</title></rect><text x="${x+bw/2}" y="${y-4}" font-size="9.5" text-anchor="middle" fill="#4A5157">${v}</text>`; });
    const lines=c.length>7?[c.slice(0,7),c.slice(7,14)]:[c]; lines.forEach((ln,k)=>{ s+=`<text x="${padL+gw*i+gw/2}" y="${H-padB+16+k*12}" font-size="10" text-anchor="middle" fill="#4A5157">${esc(ln)}</text>`; }); });
  return s+'</svg>';
}

// 等級內小點項「過半」即符合；次核心達成等級＝從 Level 1 起連續符合的最高等級
const levelMet = arr => arr.filter(Boolean).length*2 > arr.length;
const subLevel = lv => { let L=0; for(let i=0;i<5;i++){ if(levelMet(lv[i])) L=i+1; else break; } return L; };
// 核心綜合等級：L1–L3 需全部次核心達該級；L4 需全部 ≥3 且 k 項達 4；L5 需 L4 成立且 k 項達 5（k 依原表）
function coreLevel(subs,k){ const m=Math.min(...subs); if(m<1) return 0; let L=Math.min(m,3); if(L===3 && subs.filter(x=>x>=4).length>=k){ L=4; if(subs.filter(x=>x>=5).length>=k) L=5; } return L; }
function qualify(cores){ if(cores.some(c=>c<3)) return 0; return Math.min(6,1+cores.filter(c=>c>=4).length); }
const blank = () => MILESTONE.map(c=>c.subs.map(s=>s[1].map(l=>l.map(()=>false))));
function fromLevels(lv){ return MILESTONE.map((c,ci)=>c.subs.map((s,si)=>s[1].map((l,li)=>l.map((_,ii)=> li<lv[ci][si] || (li===lv[ci][si] && ii===0 && l.length>2))))); }
const levelsOf = ind => ind ? MILESTONE.map((c,ci)=>c.subs.map((s,si)=>subLevel(ind[ci][si]))) : null;
const coresOf = ind => ind ? levelsOf(ind).map((s,ci)=>coreLevel(s,MILESTONE[ci].k)) : null;

/* 內建 .xlsx 讀取（不需外部元件）：解壓 zip → 讀 workbook、sharedStrings、sheet XML */
async function readXlsx(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf), dec=new TextDecoder();
  let eocd=-1; for(let i=buf.byteLength-22;i>=0;i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd<0) throw new Error('不是有效的 .xlsx 檔');
  const n=dv.getUint16(eocd+10,true); let off=dv.getUint32(eocd+16,true); const files={};
  for(let k=0;k<n;k++){
    const method=dv.getUint16(off+10,true), csize=dv.getUint32(off+20,true), nl=dv.getUint16(off+28,true), el=dv.getUint16(off+30,true), cl=dv.getUint16(off+32,true), lho=dv.getUint32(off+42,true);
    const name=dec.decode(u8.subarray(off+46,off+46+nl));
    const ds=lho+30+dv.getUint16(lho+26,true)+dv.getUint16(lho+28,true);
    files[name]={method,data:u8.subarray(ds,ds+csize)}; off+=46+nl+el+cl;
  }
  const text=async name=>{ const f=files[name]; if(!f) return null; if(f.method===0) return dec.decode(f.data);
    const st=new Blob([f.data]).stream().pipeThrough(new DecompressionStream('deflate-raw')); return await new Response(st).text(); };
  const xml=s=>new DOMParser().parseFromString(s,'application/xml');
  const wb=xml(await text('xl/workbook.xml')), rels=xml(await text('xl/_rels/workbook.xml.rels'));
  const rmap={}; [...rels.getElementsByTagName('Relationship')].forEach(r=>rmap[r.getAttribute('Id')]=r.getAttribute('Target'));
  const ssx=await text('xl/sharedStrings.xml'), ss=ssx?[...xml(ssx).getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join('')):[];
  const out={};
  for(const sh of wb.getElementsByTagName('sheet')){
    const rid=sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    let tgt=rmap[rid]||''; tgt=tgt.replace(/^\//,''); if(!tgt.startsWith('xl/')) tgt='xl/'+tgt;
    const sx=await text(tgt); if(!sx) continue;
    const rows=[];
    for(const row of xml(sx).getElementsByTagName('row')){
      const arr=[];
      for(const c of row.getElementsByTagName('c')){
        const ref=c.getAttribute('r'), col=ref.replace(/\d+/g,'').split('').reduce((a,ch)=>a*26+ch.charCodeAt(0)-64,0)-1;
        const t=c.getAttribute('t'), v=c.getElementsByTagName('v')[0];
        let val='';
        if(t==='s') val=ss[+v.textContent]??''; else if(t==='inlineStr') val=[...c.getElementsByTagName('t')].map(x=>x.textContent).join(''); else if(v) val=v.textContent;
        arr[col]=val;
      }
      rows[+row.getAttribute('r')-1]=arr;
    }
    out[sh.getAttribute('name')]=rows;
  }
  return out;
}
function sheetToObjects(rows){ const h=(rows[0]||[]).map(x=>String(x??'').trim()); return rows.slice(1).filter(r=>r&&r.some(v=>v!==''&&v!=null)).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??'']))); }

function readRealFile(f){
  if(!f) return;
  if(!/\.xlsx$/i.test(f.name)){ toast('請選擇 .xlsx 檔（舊版 .xls 請先另存為 .xlsx）'); return; }
  const fr=new FileReader();
  fr.onload=async e=>{ try{
    const book=await readXlsx(e.target.result); const sh=book['課程清單']||Object.values(book)[0];
    const rows=sheetToObjects(sh||[]);
    const teachers=new Set(TEACH_NAMES()), studs=new Set(STUD_NAMES()), key=c=>`${c.stage}｜${String(c.name).replace(/\s/g,'')}｜${c.student}`;
    const idx=new Map(RC.map(c=>[key(c),c]));
    const plan=[];
    rows.forEach(r=>{ if(!r['課程名稱']) return;
      const row={stage:String(r['課程階段']||'').trim(),dept:r['課程部門']||'',name:String(r['課程名稱']).trim(),teacher:String(r['臨床教師']||'').trim(),student:String(r['學員']||'').trim(),
        planned:String(r['預訂執行']||''),d:ymd(String(r['授課日期']||'').replace(/\D/g,'')),place:r['學習地點']||'',holistic:r['全人照護課程']==='是',sv:String(r['問卷類型']||'').split('\n').map(s=>s.trim()).filter(Boolean),notify:String(r['問卷通知']||'發送')};
      if(row.teacher && !teachers.has(row.teacher)){ plan.push({act:'錯誤',row,why:`找不到教師「${row.teacher}」，請確認人員名單`}); return; }
      if(row.student && !studs.has(row.student)){ plan.push({act:'錯誤',row,why:`找不到學員「${row.student}」`}); return; }
      const cur=idx.get(key(row));
      if(!cur){ plan.push({act:'新增',row,why:row.d?`授課日期 ${row.d}`:'尚無授課日期（待排課）'}); return; }
      const diffs=[]; if((cur.d||'')!==(row.d||'')) diffs.push(`日期 ${cur.d||'未排定'} → ${row.d||'未排定'}`); if(row.teacher&&cur.teacher!==row.teacher) diffs.push(`教師 ${cur.teacher||'—'} → ${row.teacher}`); if(row.place&&cur.place!==row.place) diffs.push(`地點 ${cur.place||'—'} → ${row.place}`);
      if(!diffs.length){ plan.push({act:'不變',row,cur}); return; }
      plan.push({act:cur.manual?'衝突':'更新',row,cur,why:(cur.manual?'網站曾手動修改；':'')+diffs.join('；')});
    });
    RIMP={step:1,file:f.name,rows:rows.length,plan}; renderRealImport();
  }catch(err){ toast('讀取失敗：請確認是 .xlsx 格式且有「課程清單」分頁'); } };
  fr.readAsArrayBuffer(f);
}
function commitRealImport(){

/* ============ 360 評核者自動分配（115 年度實際名單與規則） ============ */
const QA_SUP=['洪利鳳','吳靖儀','蕭百舒'];
const PROMO_EXTRA=['吳靖儀','蕭百舒'];   // 11/4 指示：可擔任晉階評核者
const R = n => REAL.roster.find(p=>p.n===n);
function stageTeachers(stage){
  const m={}; RC.filter(c=>SENDS(c) && c.stage===stage && c.teacher && c.sv.some(s=>s.includes('360'))).forEach(c=>{ (m[c.teacher]=m[c.teacher]||new Set()); if(c.student) m[c.teacher].add(c.student); });
  return Object.entries(m).map(([t,s])=>({t,students:s.size}));
}
const STAGES_360 = () => [...new Set(RC.filter(c=>SENDS(c)&&c.teacher&&c.sv.some(s=>s.includes('360'))).map(c=>c.stage))];
let ASSIGN = {stage:'共通醫學檢驗', rows:null, sent:{}};
/* 115 年度：資歷較淺者（職級「醫檢師」）及龔柏誠暫不擔任 360 評核者（11/9 指示） */
const NO_360_RATER = ['龔柏誠'];
const can360Rate = p => p.rank!=='醫檢師' && !NO_360_RATER.includes(p.n);
const peerPool = me => REAL.roster.filter(p=>p.role==='教師' && p.g360===me.g360 && p.n!==me.n && !p.sup && can360Rate(p));
function autoAssign(stage){
  const load={}, hload={}; REAL.roster.forEach(p=>{load[p.n]=0;hload[p.n]=0;});
  const least=(c,L)=>{ if(!c.length) return null; c.sort((a,b)=>(L[a]-L[b])||a.localeCompare(b,'zh-Hant')); L[c[0]]++; return c[0]; };
  return stageTeachers(stage).map(({t,students})=>{
    const me=R(t);
    if(!me) return {t,g:'檢查室',skip:true,students,why:'檢查室教師不執行 360'};
    let head;
    if(me.g360==='教學品保組') head=least(QA_SUP.filter(n=>n!==t),hload);
    else if(me.sup) head='a40469（洪利鳳）';
    else head=(REAL.roster.find(p=>p.sup && p.g360===me.g360)||{}).n||null;
    const headName=head&&head.startsWith('a40469')?'洪利鳳':head;
    const pool=peerPool(me).map(p=>p.n).filter(n=>n!==headName);   // 同一位評核者不重複擔任兩個來源
    const peer=least(pool.slice(),load);
    const promoPool=[...new Set(pool.filter(n=>R(n).promo).concat(me.g360==='教學品保組'?PROMO_EXTRA:[]))].filter(n=>n!==t && n!==peer && n!==headName);
    const promo=least(promoPool,load);
    return {t,g:me.g360,rank:me.rank||'—',isSup:me.sup,students,peer,promo,head};
  });
}

  return `<div class="card">

STATE.statsF={year:'全部',stage:'全部',dept:'全部',teacher:'全部',student:'全部'};

const f1 = v => v==null ? '—' : (Math.round(v*10)/10).toFixed(1);
const yearOf = g => g.m.slice(0,4);
const rocY = y => `${y}（${Number(y)-1911}）`;
function statRows(F,skip){ return RG.filter(g=>(skip==='year'||F.year==='全部'||yearOf(g)===F.year)&&(skip==='stage'||F.stage==='全部'||g.stage===F.stage)&&(skip==='dept'||F.dept==='全部'||g.dept===F.dept)&&(skip==='teacher'||F.teacher==='全部'||g.teacher===F.teacher)&&(skip==='student'||F.student==='全部'||g.stu===F.student)); }
/* 量值定義＝Power BI「臨床病理部PGY成效追蹤-2026」DAX（2026/11/05 讀取） */
const PBI_EXCL=['檢查室臨床教師','永康代訓臨床教師'];
const keyOf = g => [g.m,g.stu,g.stage,g.dept].join('_');   // #KEY＝年月_學員_課程階段_課程部門
function measures(L){
  const T=t=>L.filter(g=>g.type===t), num=a=>a.filter(g=>isNum(g.res)).map(g=>Number(g.res));
  const pa=avg(num(T('筆試前測'))), pb=avg(num(T('筆試後測'))), dv=avg(num(T('DOPS')));
  return {
    courses:new Set(L.filter(g=>g.kind!=='心得').map(g=>g.course)).size,                      // 課程數(不含心得)：資料類型<>心得
    teach:new Set(L.map(g=>keyOf(g)+'|'+g.teacher+'|'+g.course+'|'+g.stu)).size,            // 教學人次：SUMMARIZE(#KEY,臨床教師,課程名稱,學員姓名)
    teachers:new Set(L.map(g=>g.teacher).filter(Boolean)).size,                            // 教師數：DISTINCTCOUNTNOBLANK
    students:new Set(L.map(g=>g.stu)).size,                                                // 課程學員數
    preN:T('筆試前測').length, postN:T('筆試後測').length,                                   // 筆試前／後測次數：COUNTROWS
    pre:pa, post:pb, gain: pa&&pb!=null ? (pb-pa)/pa*100 : null,                            // 筆試進步率：DIVIDE(後−前, 前)
    dopsCourses:new Set(T('DOPS').map(g=>g.course)).size, dopsN:T('DOPS').length,           // DOPS課程數、DOPS次數
    dops: dv==null?null:Math.round(dv*10)/10,                                               // DOPS平均：ROUND(AVERAGE,1)
    dopsScored:num(T('DOPS')).length,
    refl:L.filter(g=>g.kind==='課程' && g.type==='心得').length,                              // 學習心得次數：考核類型＝心得
    reflStage:L.filter(g=>g.kind==='心得').length,                                          // 各課程階段學習心得次數：資料類型＝心得
  };
}
function teachTop5(L){
  const m={}; L.forEach(g=>{ if(!g.teacher||PBI_EXCL.includes(g.teacher)) return; (m[g.teacher]=m[g.teacher]||new Set()).add(keyOf(g)+'|'+g.course+'|'+g.stu); });
  const arr=Object.entries(m).map(([t,s])=>[t,s.size]).sort((a,b)=>b[1]-a[1]);
  const ranks=[...new Set(arr.map(x=>x[1]))];                  // DENSE 排名，取前 5 名（同分並列）
  return arr.filter(x=>ranks.indexOf(x[1])<5);
}

function svRows(k,F,skip){
  return SVR[k].filter(r=>(skip==='year'||F.year==='全部'||r.m.slice(0,4)===F.year)&&(skip==='stage'||F.stage==='全部'||r.stage===F.stage)&&(skip==='dept'||F.dept==='全部'||r.dept===F.dept)&&(skip==='teacher'||F.teacher==='全部'||r.teacher===F.teacher)&&(skip==='student'||F.student==='全部'||r.stu===F.student)&&(k!=='t360'||skip==='rtype'||!F.rtype||F.rtype==='全部'||r.type===F.rtype));
}
const itemAvg = (L,i) => L.length? L.reduce((a,r)=>a+r.s[i],0)/L.length*10 : null;

  OLDQ[k].forEach(([_,ni],i)=>{ if(!ni) return; const cs=String(qs[ni-1][1]||'').split(/[,，、]/).map(x=>x.replace(/（.*）/,'').trim()); cs.forEach(c=>{ if(acc[c]) acc[c].push(itemAvg(L,i)); }); });

}
function lineSVG({cats,series,min=80,max=100,height=220,cut}){
  const W=640,H=height,pl=36,pr=12,pt=14,pb=34,iw=W-pl-pr,ih=H-pt-pb, x=i=>pl+(cats.length<2?iw/2:i*iw/(cats.length-1)), y=v=>pt+ih-(v-min)/(max-min)*ih;
  let g=''; for(let t=min;t<=max;t+=5) g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="#E6E1D8"/><text x="${pl-6}" y="${y(t)+4}" font-size="10" text-anchor="end" fill="#8A8F93">${t}</text>`;
  cats.forEach((c,i)=>{ if(cats.length<=14||i%2===0) g+=`<text x="${x(i)}" y="${H-12}" font-size="10" text-anchor="middle" fill="#8A8F93">${c}</text>`; });
  const ci=cats.findIndex(c=>c>=cut); if(cut){ const cx= ci<0 ? W-pr : (ci===0?pl:(x(ci-1)+x(ci))/2); g+=`<line x1="${cx}" x2="${cx}" y1="${pt}" y2="${pt+ih}" stroke="#E07A5F" stroke-dasharray="4 4"/><text x="${cx-4}" y="${pt+10}" font-size="10" text-anchor="end" fill="#E07A5F">115-V1 改版 ▸</text>`; }
  series.forEach(s=>{ const pts=s.vals.map((v,i)=>v==null?null:[x(i),y(Math.max(min,v)),v]).filter(Boolean);
    if(pts.length>1) g+=`<polyline fill="none" stroke="${s.color}" stroke-width="2" points="${pts.map(p=>p[0]+','+p[1]).join(' ')}"/>`;
    pts.forEach(p=>g+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${s.hollow?'#fff':s.color}" stroke="${s.color}" stroke-width="2"><title>${s.name}：${p[2].toFixed(1)}</title></circle>`); });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}</svg>`;
}

/* ---------- 圖表 ---------- */
function pbColChart({cats, series, min=0, max=100, ref=80, height=300, gw=56, drill}){
  const n=cats.length||1, W=Math.max(760, 50+n*gw), H=height, pl=46, pb=92, pt=26, iw=W-pl-12, ih=H-pt-pb, g=iw/n, bw=Math.min(24,(g-10)/series.length);
  const y=v=>pt+ih-(Math.max(min,v)-min)/(max-min)*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">`;
  [0,50,100].filter(t=>t>=min&&t<=max).forEach(t=>s+=`<line x1="${pl}" x2="${W-12}" y1="${y(t)}" y2="${y(t)}" stroke="#E4EAF0"/><text x="${pl-8}" y="${y(t)+4}" font-size="12" text-anchor="end" fill="#5C6670">${t}</text>`);
  cats.forEach((c,i)=>{ const x0=pl+g*i+(g-bw*series.length)/2;
    series.forEach((se,j)=>{ const v=se.vals[i]; if(v==null) return; const x=x0+j*bw, yy=y(v);
      s+=`<rect x="${x}" y="${yy}" width="${bw-1.5}" height="${pt+ih-yy}" fill="${se.color}" ${drill?`class="pb-click" data-cat="${esc(c)}" onclick="pbDrill('${drill[0]}','${drill[1]}',this.dataset.cat)"`:''}><title>${esc(c)}｜${esc(se.name)}：${fx(v)}${drill?'（點選篩選）':''}</title></rect><text x="${x+bw/2}" y="${yy-5}" font-size="9.5" text-anchor="middle" fill="#3B4650">${se.dec===0?Math.round(v):fx(v)}</text>`; });
    s+=`<text transform="translate(${pl+g*i+g/2+4},${pt+ih+12}) rotate(-40)" font-size="11" text-anchor="end" fill="#3B4650" ${drill?`class="pb-click" data-cat="${esc(c)}" onclick="pbDrill('${drill[0]}','${drill[1]}',this.dataset.cat)"`:''}>${esc(short(c,10))}<title>${esc(c)}</title></text>`; });
  if(ref!=null) s+=`<line x1="${pl}" x2="${W-12}" y1="${y(ref)}" y2="${y(ref)}" stroke="${PBC.ref}" stroke-width="3" stroke-dasharray="12 9"/>`;
  return `<div style="overflow-x:auto">${s}</svg></div>`;
}
function pbHBar(rows){ // 前後測趨勢：依年

  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"><circle cx="10" cy="10" r="4" fill="#4C8DF6"/><text x="18" y="14" font-size="11" fill="#3B4650">前測平均</text><circle cx="82" cy="10" r="4" fill="#1F2D8A"/><text x="90" y="14" font-size="11" fill="#3B4650">後測平均</text>`;
  [60,80,100].forEach(t=>s+=`<line x1="${x(t)}" x2="${x(t)}" y1="24" y2="${H-20}" stroke="#E4EAF0"/><text x="${x(t)}" y="${H-6}" font-size="11" text-anchor="middle" fill="#5C6670">${t}</text>`);
  rows.forEach(([lab,a,b],i)=>{ const y0=28+i*rowH; s+=`<text x="${pl-8}" y="${y0+17}" font-size="12" font-weight="600" text-anchor="end" fill="#3B4650">${lab}</text>`;
    if(a!=null) s+=`<rect x="${pl}" y="${y0+2}" width="${x(a)-pl}" height="12" fill="#4C8DF6"/><text x="${pl+4}" y="${y0+12}" font-size="10" fill="#fff">${fx(a)}</text>`;
    if(b!=null) s+=`<rect x="${pl}" y="${y0+15}" width="${x(b)-pl}" height="12" fill="#1F2D8A"/><text x="${(pl+x(b))/2}" y="${y0+25}" font-size="10" text-anchor="middle" fill="#fff">${fx(b)}</text>`; });

function pbRadar(labels, series, {min=70,max=100,size=340,labelLen=11}={}){
  if(!series.length || series.every(s=>!s.vals)) return '<p class="pb-empty">沒有符合篩選的回覆</p>';
  const lo=Math.min(min, ...series.flatMap(s=>s.vals||[]).filter(v=>v!=null).map(v=>Math.floor(v/5)*5));
  const ticks=[]; for(let t=lo;t<=max;t+=5) ticks.push(t);
  return radarSVG({labels:labels.map(l=>short(l.replace(/^您對這位學生/,'').replace(/(之|的)?滿意度為？?$|之滿意度$/,'').replace(/^對/,''),labelLen)), min:lo, max, ticks, size, series:series.map(s=>({...s, vals:s.vals&&s.vals.map(v=>v==null?lo:Math.round(v*10)/10)}))});
}

// 矩陣：rows 依 levels 分組（第一層預設展開），columns 為 colKey 的值，cell=valueFn(rows)
function pbMatrix({rows, levels, colKey, cols, valueFn, levelLabel, pageKey, totalCol=true}){
  const colVals = cols || [...new Set(rows.map(colKey))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'zh-Hant'));
  const cell = L => { const v=L.length?valueFn(L):null; return v==null?'':fx(v); };
  let out='';
  const walk=(L,depth,prefix)=>{ const keyFn=levels[depth]; const groups={}; L.forEach(r=>{ const k=keyFn(r)||'（空白）'; (groups[k]=groups[k]||[]).push(r); });
    Object.keys(groups).sort((a,b)=>a.localeCompare(b,'zh-Hant')).forEach(k=>{ const id=pageKey+'|'+prefix+'|'+k, last=depth===levels.length-1, open= depth===0 ? PB.open[id]!==false : !!PB.open[id];
      out+=`<tr class="lv${depth}"><td style="padding-left:${8+depth*18}px">${last?'':`<button class="pb-tg" onclick="PB.open['${id.replace(/'/g,"\\'")}']=${depth===0?`(PB.open['${id.replace(/'/g,"\\'")}']===false)`:`!PB.open['${id.replace(/'/g,"\\'")}']`};render()">${open?'⊟':'⊞'}</button>`}${esc(k)}</td>${colVals.map(c=>`<td class="n">${cell(groups[k].filter(r=>colKey(r)===c))}</td>`).join('')}${totalCol?`<td class="n b">${cell(groups[k])}</td>`:''}</tr>`;
      if(!last && open) walk(groups[k],depth+1,prefix+'|'+k); }); };
  walk(rows,0,'');
  return `<div class="pb-scroll"><table class="pb-table pb-matrix"><thead><tr><th>${levelLabel}</th>${colVals.map(c=>`<th class="n">${esc(c)}</th>`).join('')}${totalCol?'<th class="n">總計</th>':''}</tr></thead><tbody>${out||`<tr><td colspan="${colVals.length+2}" class="pb-empty">沒有符合篩選的資料</td></tr>`}<tr class="tot"><td>總計</td>${colVals.map(c=>`<td class="n">${cell(rows.filter(r=>colKey(r)===c))}</td>`).join('')}${totalCol?`<td class="n">${cell(rows)}</td>`:''}</tr></tbody></table></div>`;
}
const pbFeedback = (L, title='相關建議') => {
  const f=L.filter(r=>r.fb && !/^(無|無意見|none|-|—)$/i.test(r.fb.trim()));
  const is360=f.some(r=>PBC.rt[r.type]); const own=is360&&!pb360Scope().all; const tcnt={}; f.forEach(r=>tcnt[r.type]=(tcnt[r.type]||0)+1); const hideT=t=>own&&tcnt[t]<3;
  const g=new Map(); f.slice().reverse().forEach(r=>{ const k=(is360?r.type:'')+'|'+r.fb.trim(); const o=g.get(k)||{r,n:0}; o.n++; g.set(k,o); });
  const order=['學員','晉階','同儕','主管'];

};


/* 六大核心：新版依各題標註的核心能力；舊版依對照表換算 */
function coresFor(k,L){
  if(!L.length) return null;
  if(PB.ver==='old') return coreScores(k,L);
  const acc={}; RADAR_LABELS.forEach(c=>acc[c]=[]);
  SURVEYS[k].qs.forEach((q,i)=>String(q[1]||'').split(/[,，、]/).map(x=>x.replace(/（.*）/,'').trim()).forEach(c=>{ if(acc[c]) acc[c].push(itemAvg(L,i)); }));
  return RADAR_LABELS.map(c=>acc[c].length? acc[c].reduce((a,b)=>a+b,0)/acc[c].length : null);
}
const CORE_N = k => { const n={}; RADAR_LABELS.forEach(c=>n[c]=0); SURVEYS[k].qs.forEach(q=>String(q[1]||'').split(/[,，、]/).map(x=>x.replace(/（.*）/,'').trim()).forEach(c=>{ if(c in n) n[c]++; })); return n; };

function pbBar(page, rows, defs, nPrimary=3){

  const optsFor = key => { const others=keys.filter(k=>k!==key); const L=rows.filter(r=>others.every(k=>!F[k]||F[k]==='全部'||PB_ACC[k](r)===F[k])); return [...new Set(L.map(PB_ACC[key]))].filter(Boolean).sort((a,b)=>String(a).localeCompare(String(b),'zh-Hant')); };
  const sel = ([key,label,fmt]) => { const cur=F[key]||'全部', o=optsFor(key), missing=cur!=='全部'&&!o.includes(cur);
    return `<label class="pb-sel ${cur!=='全部'?'on':''}"><span>${label}</span><select onchange="pbF('${page}')['${key}']=this.value;render()"><option value="全部">全部（${o.length}）</option>${missing?`<option selected value="${esc(cur)}">${esc(fmt?fmt(cur):cur)}（此條件下無資料）</option>`:''}${o.map(v=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(fmt?fmt(v):v)}</option>`).join('')}</select></label>`; };
  const prim=defs.slice(0,nPrimary), sec=defs.slice(nPrimary), act=keys.filter(k=>F[k]&&F[k]!=='全部').length, secAct=sec.filter(d=>F[d[0]]&&F[d[0]]!=='全部').length;
  const open=PB.more||secAct>0;

/* 學習成效亮點：給評鑑委員一眼看到成效（進步幅度、通過率、各階段前→後） */
function pbOutcome(G){
  const num=t=>G.filter(g=>g.type===t&&isNum(g.res));
  const pre=num('筆試前測'), post=num('筆試後測'), dops=num('DOPS');
  const pa=avg(pre.map(g=>g.res)), pb=avg(post.map(g=>g.res));
  const passOf=L=>{ const w=L.filter(g=>isNum(g.std)); return w.length? w.filter(g=>Number(g.res)>=Number(g.std)).length/w.length*100 : null; };
  const postPass=passOf(post), dopsPass=passOf(dops);
  // 各階段前→後（啞鈴圖）
  const st={}; [...pre,...post].forEach(g=>{ (st[g.stage]=st[g.stage]||{pre:[],post:[]})[g.type==='筆試前測'?'pre':'post'].push(Number(g.res)); });
  const rows=Object.entries(st).map(([k,v])=>[k,avg(v.pre),avg(v.post)]).filter(x=>x[1]!=null&&x[2]!=null).sort((a,b)=>(b[2]-b[1])-(a[2]-a[1]));
  const W=420, rh=22, H=rows.length*rh+8, pl=110, iw=W-pl-46, min=40, X=v=>pl+(Math.max(min,v)-min)/(100-min)*iw;
  let sv=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
  rows.forEach(([k,a,b],i)=>{ const y=i*rh+12; sv+=`<text x="${pl-8}" y="${y+4}" font-size="11" text-anchor="end" fill="#3B4650">${esc(short(k,8))}<title>${esc(k)}</title></text><line x1="${X(a)}" x2="${X(b)}" y1="${y}" y2="${y}" stroke="#B9C7E6" stroke-width="4" stroke-linecap="round"/><circle cx="${X(a)}" cy="${y}" r="4.5" fill="#4C8DF6"><title>前測 ${fx(a)}</title></circle><circle cx="${X(b)}" cy="${y}" r="4.5" fill="#1F2D8A"><title>後測 ${fx(b)}</title></circle><text x="${W-4}" y="${y+4}" font-size="11" font-weight="700" text-anchor="end" fill="#2F7A5F">+${fx(b-a)}</text>`; });
  sv+='</svg>';
  const chip=(v,l,h)=>`<div class="pb-oc"><b>${v}</b><span>${l}</span>${h?`<em>${h}</em>`:''}</div>`;
  return `<div class="pb-ocrow">${chip(pa!=null&&pb!=null?'+'+fx(pb-pa):'—','平均進步（分）',`前 ${fx(pa)} → 後 ${fx(pb)}`)}${chip(postPass==null?'—':Math.round(postPass)+'%','後測達標率',`${post.length} 次筆試`)}${chip(dopsPass==null?'—':Math.round(dopsPass)+'%','DOPS 達標率',`${dops.length} 份`)}</div>
    ${rows.length?`<div class="pb-oc-h">各課程階段前測 → 後測（依進步幅度排序）</div>${sv}`:''}
    ${pa!=null&&pb!=null?`<p class="pb-oc-note">✦ 經課程訓練後，筆試平均由 ${fx(pa)} 提升至 ${fx(pb)}（+${fx(pb-pa)} 分）${postPass!=null?`，後測達標率 ${Math.round(postPass)}%`:''}${dopsPass!=null?`；DOPS 實作達標率 ${Math.round(dopsPass)}%`:''}。</p>`:''}`;
}

function gradeScope(){
  const r=STATE.role;
  if(r==='admin'||r==='qa'||r==='head') return {all:true, why:r==='admin'?'教學計畫主持人':r==='qa'?'教學負責人':'主管'};

  if(r==='mentor'){ const ms=PB.mentees; return {pred:g=>ms.includes(g.stu), label:`導師 ${esc(PB.asMentor)}：顯示負責學員 <b>${esc(ms.join('、'))}</b> 的評核成績`}; }
  const me=PB.asTeacher;

            <p class="small muted">請輸入您的人事號</p>
            <div class="field"><label for="lg-pid">人事號</label><input id="lg-pid" autocomplete="username" placeholder="例如 931070" required oninput="document.getElementById('lg-pin-f').style.display='none';document.getElementById('lg-pin').value=''"></div>
            <div class="field" id="lg-pin-f" style="display:none"><label for="lg-pin">登入碼</label><input id="lg-pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="6 位數字"></div>
            <div id="lg-msg" class="login-msg">${msg||''}</div>
            <button class="btn coral" type="submit" id="lg-btn">登入</button>
            <p class="xs muted login-help">主任、組長、專員、導師與管理者需另輸入自己設定的 6 位數登入碼。<br>也可直接點 Teams 通知中的個人連結登入；問題請洽教學品保組 a40469。</p>
          </form>
        </div>
      </section>
    </main>`;
    setTimeout(()=>{ const i=document.getElementById('lg-pid'); i&&i.focus(); }, 50);
  };
  const pinForm = (title, desc, cancel) => `<form class="login-card" onsubmit="event.preventDefault();window.__savePin()" style="margin:0 auto">
      <h2>${title}</h2><p class="small muted">${desc}</p>
      <div class="field"><label for="sp-1">新的登入碼（6 位數字）</label><input id="sp-1" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password" required></div>
      <div class="field"><label for="sp-2">再輸入一次</label><input id="sp-2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password" required></div>
      <div id="sp-msg" class="login-msg"></div>
      <button class="btn coral" type="submit" id="sp-btn">儲存登入碼</button>
      ${cancel ? '<button class="btn ghost" type="button" onclick="closeModal()">取消</button>' : ''}
      <p class="xs muted login-help">請勿使用 123456、000000 這類容易被猜到的數字。登入碼只有您自己知道，管理者也看不到；忘記時請 a40469 重發初始登入碼。</p></form>`;
  window.__savePin = async () => {
    const a=document.getElementById('sp-1').value.trim(), b2=document.getElementById('sp-2').value.trim(), m=document.getElementById('sp-msg');
    if(!/^\d{6}$/.test(a)){ m.textContent='登入碼須為 6 位數字'; return; }
    if(a!==b2){ m.textContent='兩次輸入不一樣'; return; }
    try{ await __API('api_set_pin', { newpin: a }); }catch(e){ m.textContent=e.message; return; }
    if(window.__APPINIT && document.getElementById('modal')){ try{ closeModal(); }catch(_){} if(window.toast) toast('登入碼已更新'); window.__PIN.pin_set=true; return; }
    location.reload();
  };
  window.__changePin = () => openModal(pinForm('變更登入碼', '設定新的 6 位數登入碼，下次登入時使用。', true));
  window.__login = async () => {
    const pid=document.getElementById('lg-pid').value.trim(), pin=document.getElementById('lg-pin').value.trim(), m=document.getElementById('lg-msg'), b=document.getElementById('lg-btn');
    const pf=document.getElementById('lg-pin-f');
    if(!pid){ m.textContent='請輸入人事號'; return; }
    if(pf.style.display!=='none' && !pin){ m.textContent='請輸入登入碼'; document.getElementById('lg-pin').focus(); return; }
    b.disabled=true; b.textContent='登入中…'; m.textContent='';
    try{
      const r = await fetch(`${__CFG.url}/rest/v1/rpc/api_login`, { method:'POST',
        headers: Object.assign({ apikey: __CFG.key, 'Content-Type':'application/json' }, /^eyJ/.test(__CFG.key) ? { Authorization: 'Bearer ' + __CFG.key } : {}),
        body: JSON.stringify({ pid, pin: pin || null }) });
      const j = await r.json().catch(()=>null);
      if(j && j.need_pin && !j.error){ pf.style.display=''; pf.querySelector('label').textContent = j.first ? '初始登入碼' : '登入碼';
        m.textContent = j.first ? '第一次登入：請輸入 a40469 提供的初始登入碼，登入後再設定您自己的登入碼。' : '此帳號需要登入碼'; b.disabled=false; b.textContent='登入'; document.getElementById('lg-pin').focus(); return; }
      if(!r.ok || !j || j.error || !j.tok){ if(j&&j.need_pin) pf.style.display=''; m.textContent = (j && (j.error || j.message)) || '登入失敗，請稍後再試'; b.disabled=false; b.textContent='登入'; return; }
      try{ localStorage.setItem('pgy-tok', j.tok); localStorage.setItem('pgy-last', String(Date.now())); }catch(e){}
      location.replace(location.pathname);
    }catch(e){ m.textContent='連線失敗，請確認網路後再試'; b.disabled=false; b.textContent='登入'; }
  };
  const num = v => (v === null || v === undefined || v === '') ? '' : (isNaN(+v) ? v : +v);
  async function boot(){
    if(!tok) return gate(idled ? `閒置超過 ${IDLE_MIN} 分鐘，已自動登出，請重新登入。` : '');
    let d; try{ d = await __API('api_bootstrap', {}); }catch(e){ try{ localStorage.removeItem('pgy-tok'); }catch(_){} return gate(/token/i.test(e.message) ? '這個連結已失效，請用人事號與登入碼登入。' : '連線失敗，請稍後再試。'); }
    const me = d.me;
    let ps = { needs_pin:false, pin_set:true }; try{ ps = await __API('api_pin_status', {}); }catch(e){}
    window.__PIN = ps;
    if(ps.needs_pin){
      const now = Date.now(); let last = 0; try{ last = +localStorage.getItem(LAST) || 0; }catch(e){}
      if(!fromUrl && last && now - last > IDLE_MIN*60000) return idleOut();
      const touch = () => { try{ localStorage.setItem(LAST, String(Date.now())); }catch(e){} };
      touch(); let lt = 0;
      ['click','keydown','scroll','mousemove','touchstart'].forEach(ev => addEventListener(ev, () => { const t = Date.now(); if(t - lt > 20000){ lt = t; touch(); } }, { passive:true, capture:true }));
      setInterval(() => { let l = 0; try{ l = +localStorage.getItem(LAST) || 0; }catch(e){} if(l && Date.now() - l > IDLE_MIN*60000) idleOut(); }, 60000);
    }
    if(ps.needs_pin && !ps.pin_set){
      const rb=document.querySelector('.demo-bar'); if(rb) rb.style.display='none'; const mm=document.getElementById('main'); if(mm) mm.style.display='none';
      document.getElementById('app-root').outerHTML = `<main id="app-root" class="login-page"><section class="login-hero" style="grid-template-columns:1fr;min-height:auto;padding:60px 20px;background:var(--paper)">
        ${pinForm(`${me.name}，請設定您的登入碼`, '您的帳號可以查看較多人員的評核資料，因此需要登入碼。請設定一組只有您知道的 6 位數字，之後登入時使用。', false)}</section></main>`;
      return;
    }
    const roles = me.pid === '960360' ? ['admin'] : me.admin ? ['qa'] : me.student ? ['student'] : (me.mentees || []).length ? ['teacher','mentor'] : ['teacher'];
    const tasks = (d.tasks || []).map(t => ({ id:t.id, batch:t.batch, survey:t.survey, target:t.target, targetDept:t.target_dept, evalGroup:t.eval_group,
      raterRole:t.rater_role, period:t.period, due:t.due, status:t.status, teacherName:t.teacher_name || '', courseType:t.course_type || 'general',
      rater:t.rater, teams:t.teams, students:t.students || '' }));
    const surveys = {}; ['t360','course','t2s','mentor','ep'].forEach(k => { surveys[k] = (d[k] || []).map(r => ({ ...r, s:(r.s || []).map(Number) })); });
    window.__BOOT = { me, roles, role: roles[0], changes: d.changes, state: d.state || {}, progress: d.progress,
      mentors: d.mentors || {},
      real: { roster: d.roster, courses: (d.courses || []).map(c => ({ ...c, dbid: c.id, sv: c.sv || [], date: c.date || '', planned: c.planned || '', place: c.place || '', student: c.student || '', teacher: c.teacher || '' })),
              grades: (d.grades || []).map(g => ({ ...g, res: num(g.res), std: num(g.std), note: g.note || '' })), surveys },
      batch: { batch: tasks[0] ? tasks[0].batch : ((d.progress && d.progress.batch) || '—'), send: '', due: tasks[0] ? tasks[0].due : '', people: { [me.pid]: { name: me.name, tasks } } } };
    document.getElementById('who-bar').innerHTML = `${me.name}（${me.pid}）已登入` + (ps.needs_pin ? ' <a href="#" onclick="window.__changePin();return false" style="color:inherit;margin-left:10px">變更登入碼</a>' : '');
    document.getElementById('app-root').remove();
    for(const id of ['app-code', 'prod-code']){ const s = document.createElement('script'); s.textContent = document.getElementById(id).textContent; document.body.appendChild(s); }
    window.__APPINIT(); window.__PROD_AFTER && window.__PROD_AFTER();
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
</html>
